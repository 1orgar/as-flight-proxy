name: CI & Build Artifacts

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proxy-server:
    name: Proxy Server (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: proxy_server
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: as_proxy_server-linux-x86_64
          - arch: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: as_proxy_server-linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "proxy_server -> target"
          key: ${{ matrix.arch }}

      - name: Run unit & integration tests
        run: cargo test --all-targets --target ${{ matrix.target }}

      - name: Build release binary (${{ matrix.arch }})
        run: |
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/as_proxy_server ./${{ matrix.artifact_name }}
          strip ./${{ matrix.artifact_name }}

      - name: Upload Proxy Server binary artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: proxy_server/${{ matrix.artifact_name }}
          if-no-files-found: error

  spark-connector:
    name: Spark Connector (Test & Fat-JAR)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spark_connector

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run Scala unit tests
        run: sbt test

      - name: Build shaded Fat-JAR (sbt assembly)
        run: sbt assembly

      - name: Upload Spark Connector Fat-JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spark-aerospike-flight-connector-jar
          path: spark_connector/target/scala-2.12/spark-aerospike-flight-connector-assembly-*.jar
          if-no-files-found: error
