name: CI & Build Artifacts

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proxy-server:
    name: Proxy Server (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: proxy_server
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: as_proxy_server-linux-x86_64
          - arch: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: as_proxy_server-linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "proxy_server -> target"
          key: ${{ matrix.arch }}

      - name: Run unit & integration tests with coverage (>= 85%)
        run: |
          cargo llvm-cov --all-targets --target ${{ matrix.target }} --summary-only --fail-under-lines 85 | tee coverage-rust.txt
          echo "### 🦀 Rust Proxy Server Coverage (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat coverage-rust.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build release binary (${{ matrix.arch }})
        run: |
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/as_proxy_server ./${{ matrix.artifact_name }}
          strip ./${{ matrix.artifact_name }}

      - name: Upload Proxy Server binary artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: proxy_server/${{ matrix.artifact_name }}
          if-no-files-found: error

  spark-connector:
    name: Spark Connector (Test & Fat-JAR)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spark_connector

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run Scala unit tests with scoverage (>= 85%)
        run: |
          sbt --batch clean coverage test coverageReport
          STMT_COV=$(python3 -c "import xml.etree.ElementTree as ET; r = ET.parse('target/scala-2.12/scoverage-report/scoverage.xml').getroot(); print(r.attrib.get('statement-rate', '0'))")
          BRANCH_COV=$(python3 -c "import xml.etree.ElementTree as ET; r = ET.parse('target/scala-2.12/scoverage-report/scoverage.xml').getroot(); print(r.attrib.get('branch-rate', '0'))")
          echo "### ⚡ Spark Connector (Scala 2.12) Coverage" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage | Minimum Threshold |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **Statement Coverage** | **${STMT_COV}%** | >= 85.00% |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch Coverage** | **${BRANCH_COV}%** | - |" >> $GITHUB_STEP_SUMMARY

      - name: Build shaded Fat-JAR (sbt assembly)
        run: sbt --batch "set ThisBuild / coverageEnabled := false" assembly

      - name: Upload Spark Connector Fat-JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spark-aerospike-flight-connector-jar
          path: spark_connector/target/scala-2.12/spark-aerospike-flight-connector-assembly-*.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [proxy-server, spark-connector]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --title "as-flight-proxy $TAG_NAME" --generate-notes
          fi
