service {
	proto-fd-max 15000
	cluster-name as-e2e-cluster
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		port 3002
		mesh-seed-address-port aerospike-1 3002
		mesh-seed-address-port aerospike-2 3002
		interval 150
		timeout 10
	}

	fabric {
		address any
		port 3001
	}
}

namespace test {
	replication-factor 2
	default-ttl 0

	storage-engine memory {
		data-size 1G
	}
}
