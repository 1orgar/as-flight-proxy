[package]
name = "as_proxy_server"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "High-performance Arrow Flight to Aerospike 8+ MPP Proxy Server"

[lib]
name = "as_proxy_server"
path = "src/lib.rs"

[[bin]]
name = "as_proxy_server"
path = "src/main.rs"

[dependencies]
aerospike = { version = "3.0.0", default-features = false, features = ["async", "rt-tokio", "serialization"] }
arrow-array = "60.1.0"
arrow-buffer = "60.1.0"
arrow-cast = "60.1.0"
arrow-data = "60.1.0"
arrow-flight = { version = "60.1.0", features = ["tls-ring"] }
arrow-ipc = { version = "60.1.0", features = ["lz4", "zstd"] }
arrow-schema = "60.1.0"
base64 = "0.22"
bytes = "1.7"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hmac = "0.12"
indexmap = "2.7"
prost = "0.14.1"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "0.8"
tonic = { version = "0.14.1", features = ["tls-ring", "gzip", "zstd", "transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tempfile = "3.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

